@active(route)
<a href="@url(route)" aria-current="page" class="flex items-center gap-3 rounded-lg bg-white/10 px-3 py-2.5 text-sm font-semibold text-white">
    <span class="h-5 w-1 -ml-3 rounded-r bg-gold"></span><pb-icon :name="icon" class="h-5 w-5 text-gold" /> {{ label }}
</a>
@else
<a href="@url(route)" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-emerald-100/80 hover:bg-white/5 hover:text-white">
    <pb-icon :name="icon" class="h-5 w-5" /> {{ label }}
</a>
@endactive
